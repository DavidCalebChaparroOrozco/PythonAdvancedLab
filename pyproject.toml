[project]
name = "python-advanced-lab"
version = "0.1.0"
description = "Personal laboratory for advanced Python practice."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "David Caleb Chaparro Orozco", email = "davidcaleb1998@hotmail.com" }
]
dependencies = [
    "ollama>=0.6.2",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
